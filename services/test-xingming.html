    // 工具：基于字符串生成稳定的伪随机数 (0~1)
    function seedRandom(str, salt) {
        var hash = 0;
        var s = str + (salt || '');
        for (var i = 0; i < s.length; i++) {
            hash = ((hash << 5) - hash) + s.charCodeAt(i);
            hash = hash & hash; // 转为32位整数
        }
        return Math.abs(hash % 10000) / 10000;
    }

    // 工具：基于字符串和种子生成范围内整数
    function seedInt(str, salt, min, max) {
        return Math.floor(seedRandom(str, salt) * (max - min + 1)) + min;
    }

    // 计算模拟笔画数（基于 charCode）
    function getStrokes(ch) {
        var code = ch.charCodeAt(0);
        // 模拟笔画：对汉字 charCode 做映射，范围 1~30
        return (code % 28) + 1;
    }

    // 五格计算
    function calcWuge(name) {
        var strokes = [];
        for (var i = 0; i < name.length; i++) {
            strokes.push(getStrokes(name[i]));
        }

        var tiange, dige, renge, zongge, waige;

        if (name.length === 2) {
            // 两字姓名
            tiange = strokes[0] + 1;
            renge = strokes[0] + strokes[1];
            dige  = strokes[1] + 1;
            zongge = strokes[0] + strokes[1];
            waige = 2;
        } else if (name.length === 3) {
            // 三字姓名（最常见）
            tiange = strokes[0] + 1;
            renge = strokes[0] + strokes[1];
            dige  = strokes[1] + strokes[2];
            zongge = strokes[0] + strokes[1] + strokes[2];
            waige = strokes[0] + strokes[2];
        } else if (name.length >= 4) {
            // 四字或以上
            tiange = strokes[0] + strokes[1];
            renge = strokes[1] + strokes[2];
            dige  = strokes[2] + strokes[3 % strokes.length];
            zongge = 0;
            for (var j = 0; j < strokes.length; j++) zongge += strokes[j];
            waige = strokes[0] + strokes[strokes.length - 1];
        } else {
            // 单字（不太正常但也处理）
            tiange = strokes[0] + 1;
            renge = strokes[0];
            dige  = 1;
            zongge = strokes[0] + 1;
            waige = 2;
        }

        return {
            tiange: tiange,
            renge: renge,
            dige: dige,
            zongge: zongge,
            waige: waige,
            strokes: strokes
        };
    }

    // 数理评分：基于数理值给出评分和吉凶
    function rateNumber(n) {
        // 传统姓名学中的吉数和凶数（简化版）
        var jiNumbers  = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,57,61,63,65,67,68];
        var xiongNumbers = [2,4,9,10,12,14,19,20,22,26,28,34,36,40,42,43,44,46,49,50,53,54,58,59,60,62,64,66];

        var mod = ((n - 1) % 81) + 1; // 取81数理循环
        var isJi = jiNumbers.indexOf(mod) !== -1;
        var isXiong = xiongNumbers.indexOf(mod) !== -1;

        var score;
        if (isJi) {
            score = 70 + (mod * 7 % 26); // 70-95
        } else if (isXiong) {
            score = 50 + (mod * 3 % 20); // 50-69
        } else {
            score = 60 + (mod * 5 % 22); // 60-81（半吉）
        }

        var rating, ratingClass;
        if (score >= 75) {
            rating = '吉';
            ratingClass = 'rating-ji';
        } else if (score < 60) {
            rating = '凶';
            ratingClass = 'rating-xiong';
        } else {
            rating = '半吉';
            ratingClass = 'rating-banji';
        }

        return { score: score, rating: rating, ratingClass: ratingClass, shuli: mod };
    }

        document.getElementById('testForm').style.display = 'none';
        document.getElementById('loadingSection').classList.add('active');
        document.getElementById('resultSection').classList.remove('active');

        // 2秒后显示结果
        setTimeout(function() {
            showResult(name, gender);
        }, 2000);
    }

    function shakeInput() {
        var input = document.getElementById('inputName');
        input.style.borderColor = 'var(--vermilion)';
        input.style.animation = 'shake 0.4s ease';
        input.focus();
        setTimeout(function() {
            input.style.borderColor = '';
            input.style.animation = '';
        }, 500);
    }

    function showResult(name, gender) {
        // 隐藏加载
        document.getElementById('loadingSection').classList.remove('active');

        // 计算五格
        var wuge = calcWuge(name);
        var ratings = {
            tiange: rateNumber(wuge.tiange),
            renge: rateNumber(wuge.renge),
            dige: rateNumber(wuge.dige),
            zongge: rateNumber(wuge.zongge),
            waige: rateNumber(wuge.waige)
        };

        // 综合评分
        var totalScore = calcTotalScore(ratings);

        // 姓名展示
        document.getElementById('resultName').textContent = name;
        document.getElementById('resultGender').textContent = gender === '男' ? '乾造 · 男' : '坤造 · 女';

        // 评分
        document.getElementById('scoreValue').textContent = totalScore;
        document.getElementById('scoreVerdict').textContent = getVerdict(totalScore);

        // 分数条动画
        var bar = document.getElementById('scoreBar');
        bar.style.width = '0%';
        setTimeout(function() {
            bar.style.width = totalScore + '%';
        }, 100);

        // 五格表格
        var wugeLabels = [
            { key: 'tiange', name: '天格', desc: '先天运（祖运）' },
            { key: 'renge',  name: '人格', desc: '主运（性格核心）' },
            { key: 'dige',   name: '地格', desc: '前运（36岁前）' },
            { key: 'zongge', name: '总格', desc: '后运（36岁后）' },
            { key: 'waige',  name: '外格', desc: '副运（社交运）' }
        ];
        var tbody = document.getElementById('wugeBody');
        tbody.innerHTML = '';
        wugeLabels.forEach(function(item) {
            var r = ratings[item.key];
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + item.name + '<div style="font-size:0.75rem;color:var(--text-light);font-weight:400;margin-top:2px;">' + item.desc + '</div></td>' +
                '<td>' + r.shuli + '</td>' +
                '<td>' + r.score + '</td>' +
                '<td><span class="' + r.ratingClass + '">' + r.rating + '</span></td>' +
                '<td style="font-size:0.8rem;text-align:left;color:var(--text-secondary);">' + getShuliMeaning(r.shuli) + '</td>';
            tbody.appendChild(tr);
        });

        // 五行属性
        var wuxing = getWuxing(name);
        document.getElementById('wuxingResult').innerHTML =
            '<div class="wuxing-badge ' + wuxing.cls + '">' + wuxing.name + '</div>' +
            '<p style="margin-top:10px;font-size:0.92rem;color:var(--text);line-height:1.7;">' + wuxing.desc + '</p>';

        // 性格暗示
        document.getElementById('personalityResult').textContent = getPersonality(name, gender);

        // 事业运
        document.getElementById('careerResult').textContent = getCareer(name, gender);

        // 感情运
        document.getElementById('loveResult').textContent = getLove(name, gender);

        // 改善建议
        var suggestions = getSuggestions(name, wuxing);
        var sugList = document.getElementById('suggestionResult');
        sugList.innerHTML = '';
        suggestions.forEach(function(s) {
            var li = document.createElement('li');
            li.textContent = s;
            sugList.appendChild(li);
        });

        // 显示结果
        document.getElementById('resultSection').classList.add('active');

        // 滚动到结果顶部
        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetTest() {
        document.getElementById('resultSection').classList.remove('active');
        document.getElementById('testForm').style.display = 'block';
        document.getElementById('inputName').value = '';
        document.getElementById('inputName').focus();
        document.getElementById('testForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 回车触发
    document.getElementById('inputName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            startAnalysis();
        }
    });

    // 抖动动画
    var shakeStyle = document.createElement('style');
    shakeStyle.textContent = '@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }';
    document.head.appendChild(shakeStyle);
    </script>
</body>
</html>
