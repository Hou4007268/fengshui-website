<main class="container"><section class="simple-card"><h1>八宅命卦测试</h1><p class="muted">输入出生年和性别，计算命卦与四吉方位。</p><div class="grid2"><div><label>出生年份</label><input id="y" type="number" min="1930" max="2026" placeholder="例如 1996"></div><div><label>性别</label><select id="g"><option value="m">男</option><option value="f">女</option></select></div></div><div style="margin-top:12px"><button id="go">计算命卦</button></div><div id="result" class="result"></div><p class="muted" style="margin-top:10px">本文仅供参考，风水文化传统讲究信则有不信则无。</p></section></main><script>(function(){var r=document.getElementById('result');function sum(n){return String(n).split('').reduce((a,b)=>a+parseInt(b,10),0)}document.getElementById('go').onclick=function(){var y=parseInt(document.getElementById('y').value||'0',10);if(!y){alert('请输入出生年份');return;}var g=document.getElementById('g').value;var s=sum(y%100);while(s>9)s=sum(s);var kua=(g==='m')?(11-s):(s+4);while(kua>9)kua=sum(kua);if(kua===5)kua=(g==='m'?2:8);var good={1:'北、东南、东、南',2:'东北、西、西北、西南',3:'南、北、东南、东',4:'北、南、东、东南',6:'西北、西南、东北、西',7:'西、西北、西南、东北',8:'西南、西北、西、东北',9:'东、东南、南、北'};r.style.display='block';r.textContent='你的命卦数：'+kua+'
四吉方：'+(good[kua]||'请咨询师傅')+'

建议：床头、书桌和常坐方位优先朝向四吉方。';};})();</script>
