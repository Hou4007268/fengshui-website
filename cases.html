        * { margin: 0; padding: 0; box-sizing: border-box; }

            font-family: 'Noto Sans SC', sans-serif;

            color: #fff;
        }
        header {
            padding: 30px 20px;
            text-align: center;
            background: rgba(0,0,0,0.3);
        }
        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #b8964c, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav {
            padding: 15px 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .nav a {
            color: #b8964c;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.95rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .section-title h2 {
            font-size: 1.6rem;
            color: #b8964c;
            margin-bottom: 10px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .case-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(184,150,76,0.2);
            transition: transform 0.3s;
        }
        .case-card:hover {
            transform: translateY(-5px);
            border-color: #b8964c;
        }
        .case-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .case-card .content {
            padding: 20px;
        }
        .case-card h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .case-card p {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .videos-section {
            margin-top: 60px;
        }
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .video-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(184,150,76,0.2);
        }
        .video-card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .video-card .content {
            padding: 15px;
        }
        .video-card h3 {
            color: #b8964c;
            font-size: 1rem;
        }
        .wechat-section {
            text-align: center;
            margin: 60px 0;
            padding: 40px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }
        .wechat-section h2 {
            color: #b8964c;
            margin-bottom: 20px;
        }
        .wechat-section img {
            width: 200px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .wechat-section p {
            color: #999;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
