    <script>
        const animals = [
            { emoji: "🦊", name: "狐狸", desc: "聪明狡黠，善于观察，适应性强的机会主义者。有自己的小算盘，但懂得审时度势。", traits: ["聪明", "灵活", "神秘"] },
            { emoji: "🐺", name: "狼", desc: "忠诚且有团队精神，但内心孤独。重视伙伴，有强烈的领地意识和保护欲。", traits: ["忠诚", "勇敢", "团队"] },
            { emoji: "🐱", name: "猫", desc: "独立自主，爱干净，有自己的节奏。看似冷漠其实很在乎，只是不轻易表达。", traits: ["独立", "优雅", "自我"] },
            { emoji: "🐕", name: "狗", desc: "热情忠诚，喜欢陪伴人类。性格开朗，喜欢互动，是天生的社交达人。", traits: ["忠诚", "热情", "友好"] },
            { emoji: "🐻", name: "熊", desc: "外表沉稳，内心柔软。力量型选手，但也有细腻的一面。", traits: ["稳重", "力量", "可靠"] },
            { emoji: "🦅", name: "鹰", desc: "高瞻远瞩，眼神锐利。喜欢独立思考，有强烈的目标导向。", traits: ["智慧", "远见", "独立"] },
            { emoji: "🐆", name: "豹", desc: "速度快，爆发力强。喜欢冒险，享受刺激带来的快感。", traits: ["敏捷", "大胆", "速度"] },
            { emoji: "🦉", name: "猫头鹰", desc: "睿智深沉，喜欢在安静中思考。洞察力强，善于发现问题。", traits: ["智慧", "洞察", "冷静"] },
            { emoji: "🐰", name: "兔子", desc: "温柔可爱，警惕性高。善于倾听，待人友好，但有时有点敏感。", traits: ["温柔", "敏感", "善良"] },
            { emoji: "🐼", name: "熊猫", desc: "呆萌可爱，与世无争。内心丰富，有自己的小世界。", traits: ["萌", "佛系", "悠然"] }
        ];
        
        function getHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }
        
        function submitTest() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            const hash = getHash(name);
            const result = animals[hash % animals.length];
            
            document.getElementById('formBox').style.display = 'none';
            document.getElementById('resultBox').classList.add('test-result-active');
            
            document.getElementById('icon').textContent = result.emoji;
            document.getElementById('animal').textContent = result.emoji + " " + result.name;
            document.getElementById('desc').textContent = result.desc;
            document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');
            
            // 显示特质标签
            const traitsHtml = result.traits.map(t => '<span class="result-trait">' + t + '</span>').join('');
            document.getElementById('traits').innerHTML = traitsHtml;
            
            localStorage.setItem('animal_test_done', name);
        }
        
        window.onload = function() {
            const done = localStorage.getItem('animal_test_done');
            if (done) {
                const hash = getHash(done);
                const result = animals[hash % animals.length];
                
                document.getElementById('formBox').style.display = 'none';
                document.getElementById('resultBox').classList.add('test-result-active');
                document.getElementById('icon').textContent = result.emoji;
                document.getElementById('animal').textContent = result.emoji + " " + result.name;
                document.getElementById('desc').textContent = result.desc;
                
                const traitsHtml = result.traits.map(t => '<span class="result-trait">' + t + '</span>').join('');
                document.getElementById('traits').innerHTML = traitsHtml;
            }
        }
    </script>
