function renderDayunList(cycles) {

  const dayun = payload.dayun || {};
  const shichen = payload.detectedShichen || '-';
  const qiyun = dayun.qiyunAge || {};

  const day = pillars.day || '-';
  const hour = pillars.hour || '-';

  const next = data.nextAction;
  const nextActionMap = { show_result: '当前资料较完整，可先查看基础结果。', show_result_with_warning: '当前结果含风险提示，建议结合提醒谨慎参考。', ask_for_more_info: '若想提高准确度，建议先补充出生资料。', handoff_to_master: '当前更适合请张师傅进一步分析。' };
  document.getElementById('nextActionText').textContent = nextActionMap[next] || '你可以继续查看结果，或转人工进一步分析。';
  const primaryBtn = document.getElementById('primaryBtn');
  const secondaryBtn = document.getElementById('secondaryBtn');
  const supplementBtn = document.getElementById('supplementBtn');
  primaryBtn.onclick = null;
  secondaryBtn.onclick = function(){ location.href='handoff.html'; };
  if (next === 'show_result') { primaryBtn.textContent = '查看完整基础解析'; primaryBtn.onclick = function(){ location.hash='core-result'; }; supplementBtn.style.display = 'none'; }
  else if (next === 'show_result_with_warning') { primaryBtn.textContent = '继续查看当前结果'; primaryBtn.onclick = function(){ location.hash='core-result'; }; supplementBtn.style.display = 'inline-block'; }
  else if (next === 'ask_for_more_info') { primaryBtn.textContent = '先完善出生资料'; primaryBtn.onclick = function(){ location.href='supplement.html'; }; supplementBtn.style.display = 'inline-block'; }
  else { primaryBtn.textContent = '请张师傅进一步详解'; primaryBtn.onclick = function(){ location.href='handoff.html'; }; supplementBtn.style.display = 'inline-block'; }
}

async function fetchLiveResultFromQuery() {
  const q = new URLSearchParams(location.search);
  if (!q.get('birthDate')) return;
  const birthTime = q.get('birthTime') || '';
  const mode = q.get('mode') === 'approx' ? 'approx' : 'exact';
  const isExact24h = /^\d{1,2}:\d{2}$/.test(birthTime);
  const payload = {
    gender: q.get('gender') === 'female' ? 'female' : 'male',
    calendar_mode: q.get('calendarMode') === 'lunar' ? 'lunar' : 'solar',
    is_deceased: false,
    allow_approximation: mode === 'approx',
    solar_birth: q.get('birthDate'),
    lunar_birth: null,
    is_leap_month: null,
    birth_time_text: birthTime || null,
    birth_time_24h: isExact24h ? birthTime : null,
    birth_shichen: null,
    birth_place: q.get('birthPlace') || '',
    timezone: 'Asia/Shanghai',
    death_year: null,
    name: '访客'
  };
  try {
    const resp = await fetch('compute.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!data.success || !data.result) return;
    const r = data.result;
    document.getElementById('profileBlock').textContent = `${payload.solar_birth} · ${birthTime || '未提供'} · ${payload.birth_place || '未提供'}`;
    document.getElementById('detected').textContent = r.computed?.shichen?.branch || '-';
    document.getElementById('candidates').textContent = (r.computed?.shichen?.candidates || [r.computed?.shichen?.branch]).filter(Boolean).join(' / ') || '-';
    const directionMap = { forward: '顺排', backward: '逆排' };
    document.getElementById('direction').textContent = directionMap[r.computed?.dayun_direction] || '-';
    const qa = r.computed?.qiyun_age || {};
    document.getElementById('qiyun').textContent = qa.years != null ? `${qa.years}岁${qa.months||0}月` : '-';
    document.getElementById('year').textContent = r.pending_engine_fields?.year_pillar || '-';
    document.getElementById('month').textContent = r.pending_engine_fields?.month_pillar || '-';
    document.getElementById('day').textContent = r.pending_engine_fields?.day_pillar || '-';
    document.getElementById('hour').textContent = r.pending_engine_fields?.hour_pillar?.label || '-';
    document.getElementById('analysisSummary').textContent = (r.warnings && r.warnings.length)
      ? `已按真实计算返回基础结果。当前提示：${r.warnings.join('；')}`
      : '已按真实计算返回基础结果，可继续查看四柱、时辰与起运信息。';
    document.getElementById('fullAnalysis').textContent = (r.warnings && r.warnings.length)
      ? `本次结果来自真实计算接口。当前告警：${r.warnings.join('；')}`
      : '本次结果来自真实计算接口，当前资料可先查看基础命盘结构、起运方向与四柱结果。';
    document.getElementById('inputLabel').textContent = r.confidence === 'high' ? '当前资料完整，可先查看基础结果' : (mode === 'approx' ? '当前为模糊时段，建议结合补充资料谨慎参考' : '当前资料已录入，可继续查看基础结果');
    renderDayunList(r.pending_engine_fields?.dayun_cycles || []);
    renderInsights({
      pillars: { year: r.pending_engine_fields?.year_pillar, month: r.pending_engine_fields?.month_pillar, day: r.pending_engine_fields?.day_pillar, hour: r.pending_engine_fields?.hour_pillar?.label },
      dayun: { direction: r.computed?.dayun_direction, qiyunAge: r.computed?.qiyun_age },
      detectedShichen: r.computed?.shichen?.branch
    });
    document.getElementById('nextActionText').textContent = r.confidence === 'high' ? '当前已拿到真实计算结果，可先查看基础结果。' : '当前已拿到真实计算结果，但建议结合提示谨慎参考。';
    const box = document.getElementById('warningBox');
    if (r.warnings && r.warnings.length) {
      box.classList.remove('hidden');
      box.innerHTML = '<strong>真实计算结果提示</strong><br>' + r.warnings.join('<br>');
    } else {
      box.classList.add('hidden');
      box.innerHTML = '';
    }
  } catch (e) {
    console.error('live compute failed', e);
  }
}

function applyQueryOverrides(){
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') === 'approx' ? 'approx' : 'exact';
  showCase(mode);
  document.getElementById('analysisSummary').textContent = '正在调用真实计算接口，请稍候…';
  const data = samples[mode];
  const birthDate = q.get('birthDate');
  const birthTime = q.get('birthTime');
  const birthPlace = q.get('birthPlace');
  if (birthDate) data.profile.birthDate = birthDate;
  if (birthTime) data.profile.birthTimeText = birthTime;
  if (birthPlace) data.profile.birthPlace = birthPlace;
  document.getElementById('profileBlock').textContent = `${data.profile.birthDate} · ${data.profile.birthTimeText} · ${data.profile.birthPlace}`;
}
applyQueryOverrides();
fetchLiveResultFromQuery();
