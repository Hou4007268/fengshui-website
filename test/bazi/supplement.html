<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>12zn 补资料页原型</title><style>
* { box-sizing: border-box; }
body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:linear-gradient(180deg,#f7f1e8 0%,#fcfaf7 100%); color:#3c3126; }
.container { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
.card { background:rgba(255,252,247,.92); border:1px solid #e8dcc8; border-radius:18px; box-shadow:0 14px 34px rgba(89,68,44,.08); }
.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.badge { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; }
.badge-high { background:#efe7da; color:#6f4e37; }
.badge-medium { background:#f6ead7; color:#8b6a4d; }
.label { font-size:12px; color:#7b6a58; margin-bottom:6px; }
.title { font-size:32px; font-weight:800; margin:0 0 8px; }
.subtitle { color:#7b6a58; line-height:1.7; }
.section { padding:20px; }
.warning { border:1px solid #f59e0b; background:linear-gradient(135deg,#fff4e6,#f8ebdb); color:#8a5a2f; border-radius:14px; padding:16px; }
.cta-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
.btn { border:none; border-radius:12px; padding:12px 18px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
.btn-primary { background:linear-gradient(135deg,#6f4e37,#8b6a4d); color:#fff; }
.btn-secondary { background:#fffaf3; color:#5f4632; border:1px solid #dcc8ab; }
.small { font-size:13px; color:#7b6a58; }
.hero { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }

@media (max-width: 900px) { .grid-2,.kv,.summary-hero { grid-template-columns:1fr !important; } .hero { flex-direction:column; } }
@media (max-width: 640px) {
  .container { padding: 20px 14px 56px !important; }
  .title { font-size: 26px !important; line-height: 1.2; }
  .subtitle { font-size: 14px !important; }
  .topnav { display:grid !important; grid-template-columns:1fr 1fr; gap:10px !important; }
  .btn, .topnav .btn { width: 100%; min-height: 44px; text-align:center; }
  .cta-row { display:grid !important; grid-template-columns:1fr; gap:10px !important; }
  .value { font-size: 16px !important; }
  .section { padding: 16px !important; }
  .warning { padding: 14px !important; }
  .spotlight { padding: 18px !important; }
  input, select { font-size: 16px !important; }
}

</style></head><body><div class="container"><div class="topnav" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px"><a class="btn btn-secondary" href="index.html">体验首页</a><a class="btn btn-secondary" href="result-summary.html">命盘概览</a><a class="btn btn-secondary" href="supplement.html">完善资料</a><a class="btn btn-secondary" href="handoff.html">张师傅详解</a></div><div class="hero"><div><h1 class="title">完善出生资料</h1><p class="subtitle">当系统识别为模糊时段、边界时辰或资料不完整时，先完善关键信息，再决定继续查看基础结果还是请张师傅进一步分析。</p></div><span class="badge badge-medium">提升判断稳定性</span></div><div class="warning"><strong>为什么建议先完善资料？</strong><br>当前结果可能受模糊时段、子时边界、历法模式不确定等因素影响。完善资料后，能明显提升判断稳定性。</div><div class="card section" style="margin-top:16px"><div class="grid grid-2"><div><div class="label">更具体的出生时间</div><input style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px" placeholder="例如 08:30 / 23:20"></div><div><div class="label">历法再确认</div><select style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px"><option>阳历</option><option>农历</option><option>不确定</option></select></div><div><div class="label">是否闰月</div><select style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px"><option>否</option><option>是</option><option>不确定</option></select></div><div><div class="label">关键人生节点（可选）</div><input style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px" placeholder="如结婚、搬家、重大病痛、事业转折"></div></div><div class="cta-row"><a class="btn btn-primary" href="result-summary.html">保存并继续查看</a><a class="btn btn-secondary" href="handoff.html">直接请张师傅详解</a><a class="btn btn-secondary" href="index.html">返回体验首页</a></div><div class="small" style="margin-top:14px">当前页只收最影响判断稳定性的少数信息，避免一开始让你填写过多内容。</div></div></div></body></html>
