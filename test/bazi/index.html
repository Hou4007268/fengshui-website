<div class="page-breadcrumb"><a href="/index.html">首页</a> <span>›</span> <a href="/test/">测试</a> <span>›</span> 八字命理体验</div><div class="container"><div class="topnav"><a class="btn btn-secondary" href="index.html">体验首页</a><a class="btn btn-secondary" href="result-summary.html">命盘概览</a><a class="btn btn-secondary" href="supplement.html">完善资料</a><a class="btn btn-secondary" href="handoff.html">张师傅详解</a></div><div class="hero"><div><h1 class="title">一宅一句 · 八字命理体验</h1><p class="subtitle">填写你的出生资料后，系统会结合时间、地点与历法信息，为你生成八字基础结果，并帮助你先看事业、财运、感情与当前阶段重点。</p></div><span class="badge">八字命理参考</span></div><form class="card section" action="result-summary.html" method="get"><div class="grid grid-2"><div><div class="label">出生日期</div><input name="birthDate" value="1990-05-15" placeholder="例如 1990-05-15"></div><div><div class="label">出生时间</div><input name="birthTime" value="08:30" placeholder="例如 08:30 / 上午 / 晚上"></div><div><div class="label">出生地</div><input name="birthPlace" value="辽宁省丹东市" placeholder="例如 辽宁省丹东市"></div><div><div class="label">历法模式</div><select name="calendarMode"><option value="solar" selected>阳历</option><option value="lunar">农历</option></select></div><div><div class="label">性别</div><select name="gender"><option value="male" selected>男</option><option value="female">女</option></select></div><div><div class="label">结果模式</div><select name="mode"><option value="exact" selected>精确时间</option><option value="approx">模糊时段</option></select></div></div><div class="cta-row"><button class="btn btn-primary" type="submit">立即查看结果</button><a class="btn btn-secondary" id="indexSupplementBtn" href="supplement.html">资料不准？先完善资料</a><a class="btn btn-secondary" id="indexConsultBtn" href="consult.html">结果出来后，再看详解说明</a></div></form><script>(function(){const form=document.querySelector('form[action="result-summary.html"]');const supplementBtn=document.getElementById('indexSupplementBtn');const consultBtn=document.getElementById('indexConsultBtn');if(!form)return;function buildQuery(){const fd=new FormData(form);const bt=String(fd.get('birthTime')||'').trim();const next=new URLSearchParams();for(const [k,v] of fd.entries()){if(v!=null&&String(v)!=='')next.set(k,String(v));}if(/^\d{1,2}:\d{2}$/.test(bt)){next.set('mode','exact');}else if(bt){next.set('mode','approx');}return next.toString();}function wire(el,path){if(!el)return;el.addEventListener('click',function(e){e.preventDefault();const qs=buildQuery();location.href=path+(qs?'?'+qs:'');});}wire(supplementBtn,'supplement.html');wire(consultBtn,'consult.html');})();</script></div><script src="/js/shared.js"></script>
