<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>12zn 八字输入页</title><style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:linear-gradient(180deg,#f7f1e8 0%,#fcfaf7 100%); color:#3c3126; }
.container { max-width:1080px; margin:0 auto; padding:32px 20px 80px; }
.card { background:rgba(255,252,247,.92); border:1px solid #e8dcc8; border-radius:18px; box-shadow:0 14px 34px rgba(89,68,44,.08); }
.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.badge { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#efe7da; color:#6f4e37; }
.label { font-size:12px; color:#7b6a58; margin-bottom:6px; }
.title { font-size:32px; font-weight:800; margin:0 0 8px; }
.subtitle { color:#7b6a58; line-height:1.7; }
.section { padding:20px; }
.cta-row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
.btn { border:none; border-radius:12px; padding:12px 18px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
.btn-primary { background:linear-gradient(135deg,#6f4e37,#8b6a4d); color:#fff; }
.btn-secondary { background:#fffaf3; color:#5f4632; border:1px solid #dcc8ab; }
.hero { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }
.topnav { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.small { font-size:13px; color:#7b6a58; }
input, select { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:12px; }
@media (max-width:900px){ .grid-2{grid-template-columns:1fr!important;} .hero{flex-direction:column;} }
@media (max-width:640px){ .container{padding:20px 14px 56px!important;} .title{font-size:26px!important;line-height:1.2;} .subtitle{font-size:14px!important;} .topnav{display:grid!important;grid-template-columns:1fr 1fr;gap:10px!important;} .btn,.topnav .btn{width:100%;min-height:44px;text-align:center;} .cta-row{display:grid!important;grid-template-columns:1fr;gap:10px!important;} .section{padding:16px!important;} input,select{font-size:16px!important;} }
</style></head><body><div class="container"><div class="topnav"><a class="btn btn-secondary" href="index.html">体验首页</a><a class="btn btn-secondary" href="result-summary.html">命盘概览</a><a class="btn btn-secondary" href="supplement.html">完善资料</a><a class="btn btn-secondary" href="handoff.html">张师傅详解</a></div><div class="hero"><div><h1 class="title">一宅一句 · 八字命盘体验</h1><p class="subtitle">现在这页已经不是演示静态页。你填写出生资料后，会真实带参跳到结果页，并按你的输入渲染基础结果。</p></div><span class="badge">真实可用最小链路</span></div><form class="card section" action="result-summary.html" method="get"><div class="grid grid-2"><div><div class="label">出生日期</div><input name="birthDate" value="1990-05-15" placeholder="例如 1990-05-15"></div><div><div class="label">出生时间</div><input name="birthTime" value="08:30" placeholder="例如 08:30 / 上午 / 晚上"></div><div><div class="label">出生地</div><input name="birthPlace" value="辽宁省丹东市" placeholder="例如 辽宁省丹东市"></div><div><div class="label">历法模式</div><select name="calendarMode"><option value="solar" selected>阳历</option><option value="lunar">农历</option></select></div><div><div class="label">性别</div><select name="gender"><option value="male" selected>男</option><option value="female">女</option></select></div><div><div class="label">结果模式</div><select name="mode"><option value="exact" selected>精确时间</option><option value="approx">模糊时段</option></select></div></div><div class="cta-row"><button class="btn btn-primary" type="submit">立即查看结果</button><a class="btn btn-secondary" href="supplement.html">先完善资料</a><a class="btn btn-secondary" href="consult.html">进入详解咨询入口</a></div></form></div></body></html>
