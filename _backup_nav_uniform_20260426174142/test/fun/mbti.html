    <script>
        const mbtiTypes = [
            { type: "INFP", name: "调停者", desc: "理想主义、富有同情心，喜欢探索可能性和创新。内心世界丰富，重视个人价值观。", emoji: "🌸" },
            { type: "INFJ", name: "提倡者", desc: "理想主义、有洞察力，天生擅长理解他人。富有创造力，看重意义和价值。", emoji: "🦉" },
            { type: "INTP", name: "逻辑学家", desc: "思想者、善于分析，喜欢理论探索。独立思考，对知识有强烈渴望。", emoji: "🧠" },
            { type: "INTJ", name: "建筑师", desc: "战略思维、独立性强，善于规划。追求知识和效率，有远见卓识。", emoji: "🏗️" },
            { type: "ISFP", name: "探险家", desc: "灵活、艺术感强，善于发现美。安静友好，注重实际体验。", emoji: "🎨" },
            { type: "ISFJ", name: "守卫者", desc: "忠诚、细心，善于照顾他人。传统价值观，实际可靠。", emoji: "🛡️" },
            { type: "ISTP", name: "鉴赏家", desc: "实用主义、善于动手，喜欢探索原理。冷静观察，分析能力强。", emoji: "🔧" },
            { type: "ISTJ", name: "物流师", desc: "可靠、传统，注重责任。善于组织，讲究逻辑和事实。", emoji: "📊" },
            { type: "ENFP", name: "竞选者", desc: "热情、创意，善于激励他人。喜欢新想法，富有感染力。", emoji: "🔥" },
            { type: "ENFJ", name: "主人公", desc: "领导者魅力、善于沟通，天生能激励他人。重视人际关系。", emoji: "⭐" },
            { type: "ENTP", name: "辩论家", desc: "聪明、好奇，喜欢挑战和辩论。善于发现问题，思维敏捷。", emoji: "💡" },
            { type: "ENTJ", name: "指挥官", desc: "果断、有领导力，善于制定战略。目标导向，决策能力强。", emoji: "👑" },
            { type: "ESFP", name: "表演者", desc: "热情、活泼，善于娱乐他人。喜欢行动，享受当下。", emoji: "🎉" },
            { type: "ESFJ", name: "执政官", desc: "关怀、传统，善于照顾他人。喜欢帮助别人，重视和谐。", emoji: "🤝" },
            { type: "ESTP", name: "企业家", desc: "大胆、实际，喜欢冒险和挑战。善于把握机会，行动派。", emoji: "🚀" },
            { type: "ESTJ", name: "总经理", desc: "传统、组织能力强，善于管理。注重效率和结果。", emoji: "📈" }
        ];
        
        function getHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }
        
        function submitTest() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            const hash = getHash(name);
            const result = mbtiTypes[hash % mbtiTypes.length];
            
            document.getElementById('formBox').style.display = 'none';
            document.getElementById('resultBox').classList.add('test-result-active');
            
            document.getElementById('icon').textContent = result.emoji;
            document.getElementById('result').textContent = result.type;
            document.getElementById('nameEmoji').innerHTML = `<strong>${result.name}</strong> · ${result.emoji}`;
            document.getElementById('desc').textContent = result.desc;
            document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');
            
            localStorage.setItem('mbti_test_done', name);
        }
        
        window.onload = function() {
            const done = localStorage.getItem('mbti_test_done');
            if (done) {
                const hash = getHash(done);
                const result = mbtiTypes[hash % mbtiTypes.length];
                
                document.getElementById('formBox').style.display = 'none';
                document.getElementById('resultBox').classList.add('test-result-active');
                document.getElementById('icon').textContent = result.emoji;
                document.getElementById('result').textContent = result.type;
                document.getElementById('nameEmoji').innerHTML = `<strong>${result.name}</strong> · ${result.emoji}`;
                document.getElementById('desc').textContent = result.desc;
            }
        }
    </script>
