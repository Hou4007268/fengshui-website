    <script>
        const stages = [
            { emoji: "🔭", name: "探索期", desc: "你正处于迷茫但充满可能的阶段。对世界充满好奇，喜欢尝试新事物，寻找自己的方向。", tip: "保持开放，多尝试新事物，不要害怕犯错。" },
            { emoji: "🌱", name: "成长期", desc: "你已经找到了方向，正在默默努力，积累经验和技能。这是一个稳步提升的阶段。", tip: "坚持学习，专注于提升核心能力。" },
            { emoji: "🏠", name: "稳定期", desc: "你的人生进入了一个相对平稳的时期。事业、家庭和人际关系都趋于稳定，是享受当下和深耕细作的好时机。", tip: "稳中求进，注重生活质量和健康。" },
            { emoji: "🔄", name: "转型期", desc: "你正在经历人生重大转折。可能是职业转型、搬家、关系变化等。充满挑战但也蕴含巨大机遇。", tip: "拥抱变化，勇敢面对新挑战，寻求专业建议。" },
            { emoji: "🚀", name: "巅峰期", desc: "你正处于人生的黄金时期，各方面都表现出色，收获丰厚。你的努力得到了充分认可和回报。", tip: "乘胜追击，但不忘初心，保持谦逊和学习。" },
            { emoji: "☕", name: "休息期", desc: "你可能感到疲惫，需要停下来调整和充电。这不是停滞，而是为了走更远的路而积蓄能量。", tip: "给自己放个假，好好休息，关注身心健康。" },
            { emoji: "🌰", name: "蛰伏期", desc: "你正处于一个积蓄力量的阶段。表面上可能不显山露水，但内在正在酝酿巨大的能量，等待爆发。", tip: "保持低调，持续学习和沉淀，等待时机。" },
            { emoji: "💥", name: "突破期", desc: "你即将迎来人生中的重大突破。这需要你付出额外的努力和勇气，但回报将是丰硕的。", tip: "勇敢迎接挑战，相信自己的潜力，坚持到底。" }
        ];
        
        function getHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash);
        }
        
        function submitTest() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            
            const hash = getHash(name);
            const result = stages[hash % stages.length];
            
            document.getElementById('formBox').style.display = 'none';
            document.getElementById('resultBox').classList.add('test-result-active');
            
            document.getElementById('icon').textContent = result.emoji;
            document.getElementById('stage').textContent = result.emoji + " " + result.name;
            document.getElementById('desc').innerHTML = result.desc + "<br><br><strong>建议：" + result.tip + "</strong>";
            document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');
            
            localStorage.setItem('lifestyle_test_done', name);
        }
        
        window.onload = function() {
            const done = localStorage.getItem('lifestyle_test_done');
            if (done) {
                const hash = getHash(done);
                const result = stages[hash % stages.length];
                
                document.getElementById('formBox').style.display = 'none';
                document.getElementById('resultBox').classList.add('test-result-active');
                document.getElementById('icon').textContent = result.emoji;
                document.getElementById('stage').textContent = result.emoji + " " + result.name;
                document.getElementById('desc').innerHTML = result.desc + "<br><br><strong>建议：" + result.tip + "</strong>";
            }
        }
    </script>
