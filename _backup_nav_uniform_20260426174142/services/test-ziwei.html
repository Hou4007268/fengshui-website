    <script>
    // ========== 星曜简解数据 ==========
    var starInfo = {
        '紫微': { type: '帝', desc: '帝王星，领导力强，自尊心高，有贵气' },
        '天机': { type: '智', desc: '智囊星，思维敏捷，善策划，多变动' },
        '太阳': { type: '光', desc: '光明星，热情博爱，适合服务业' },
        '武曲': { type: '财', desc: '财星，务实刚毅，善于理财' },
        '天同': { type: '福', desc: '福星，温和善良，享乐主义' },
        '廉贞': { type: '囚', desc: '外冷内热，适合纪律部队或管理工作' },
        '天府': { type: '库', desc: '库星，稳重保守，善于积累' },
        '太阴': { type: '富', desc: '富星，温柔细腻，财运好' },
        '贪狼': { type: '桃', desc: '桃花星，多才多艺，欲望强' },
        '巨门': { type: '暗', desc: '口才好，善于表达，但易招是非' },
        '天相': { type: '印', desc: '印星，忠厚老实，辅佐型人才' },
        '天梁': { type: '荫', desc: '荫星，成熟稳重，有长辈缘' },
        '七杀': { type: '将', desc: '将星，冲劲足，适合开拓新领域' },
        '破军': { type: '耗', desc: '耗星，开创力强，变动多' }
    };

    // ========== 排盘 ==========
    window.startChart = function() {
        var dateStr = document.getElementById('birth-date').value;
        var hourIdx = parseInt(document.getElementById('birth-hour').value);
        var gender = document.getElementById('birth-gender').value;

        if (!dateStr) { alert('请选择出生日期'); return; }

        try {
            var astrolabe = iztro.astro.bySolar(dateStr, hourIdx, gender, false, 'zh-CN');
            showResult(astrolabe, dateStr, hourIdx, gender);
        } catch(e) {
            alert('排盘出错：' + e.message);
        }
    };

    // ========== 显示结果 ==========
    function showResult(astrolabe, dateStr, hourIdx, gender) {
        var screen = document.getElementById('result-screen');
        document.getElementById('start-screen').style.display = 'none';

        // 获取命宫
        var mingPalace = null;
        for (var i = 0; i < astrolabe.palaces.length; i++) {
            if (astrolabe.palaces[i].name === '命宫') {
                mingPalace = astrolabe.palaces[i];
                break;
            }
        }

        // 命宫主星
        var majorStars = [];
        if (mingPalace && mingPalace.majorStars) {
            for (var j = 0; j < mingPalace.majorStars.length; j++) {
                var star = mingPalace.majorStars[j];
                if (star && star.name) majorStars.push(star.name);
            }
        }

        // 十二宫按位置排列（标准紫微盘排列）
        // 行1: 巳 午 未 申
        // 行2: 辰 [中心] 酉
        // 行3: 卯 [中心] 戌
        // 行4: 寅 丑 子 亥
        var palaceOrder = ['巳', '午', '未', '申', '辰', '', '', '酉', '卯', '', '', '戌', '寅', '丑', '子', '亥'];
        var palaceByEarthly = {};
        for (var i = 0; i < astrolabe.palaces.length; i++) {
            var p = astrolabe.palaces[i];
            if (p.earthlyBranch) {
                palaceByEarthly[p.earthlyBranch] = p;
            }
        }

        var html = '';

        // Header
        html += '<div class="result-header">';
        html += '<h2>🔮 你的紫微命盘</h2>';
        html += '<div class="basic-info">';
        html += '公历：' + dateStr + '　性别：' + gender;
        if (astrolabe.lunarDate) html += '　农历：' + astrolabe.lunarDate;
        if (astrolabe.chineseDate) html += '　四柱：' + astrolabe.chineseDate;
        html += '</div>';
        html += '</div>';

        // Chart Grid
        html += '<div class="chart-grid">';

        for (var i = 0; i < 16; i++) {
            var branch = palaceOrder[i];

            if (branch === '') {
                // Center cell
                html += '<div class="palace-cell center-cell">';
                html += '<div class="ming-zhu">';
                if (majorStars.length > 0) html += majorStars[0];
                else html += '—';
                html += '</div>';
                html += '<div class="wuxing">';
                if (astrolabe.fiveElementsClass) html += astrolabe.fiveElementsClass;
                html += '</div>';
                html += '</div>';
                continue;
            }

            var p = palaceByEarthly[branch];
            if (!p) {
                html += '<div class="palace-cell"><div class="palace-name">' + branch + '</div></div>';
                continue;
            }

            var isMing = (p.name === '命宫');
            html += '<div class="palace-cell' + (isMing ? ' highlight' : '') + '">';
            html += '<div class="palace-name">' + p.name + '</div>';

            // Major stars
            if (p.majorStars && p.majorStars.length > 0) {
                var starNames = [];
                for (var s = 0; s < p.majorStars.length; s++) {
                    var star = p.majorStars[s];
                    if (star && star.name) starNames.push(star.name);
                }
                html += '<div class="palace-major">' + starNames.join(' ') + '</div>';
            }

            // Minor stars (show first few)
            if (p.minorStars && p.minorStars.length > 0) {
                var minorNames = [];
                for (var s = 0; s < Math.min(p.minorStars.length, 4); s++) {
                    var star = p.minorStars[s];
                    if (star && star.name) minorNames.push(star.name);
                }
                if (minorNames.length > 0) {
                    html += '<div class="palace-minor">' + minorNames.join('·') + '</div>';
                }
            }

            html += '</div>';
        }

        html += '</div>';

        // Interpretation Cards
        // 1. 命宫解读
        html += '<div class="interp-card">';
        html += '<h3>⭐ 命宫解读</h3>';
        html += '<p>';
        if (majorStars.length > 0) {
            html += '你的命宫主星是<strong>' + majorStars.join('、') + '</strong>。';
            for (var s = 0; s < majorStars.length; s++) {
                var info = starInfo[majorStars[s]];
                if (info) {
                    html += majorStars[s] + '是' + info.desc + '。';
                }
            }
            html += '\n\n命宫决定了你的核心性格和人生底色。';
        } else {
            html += '你的命宫无主星独坐，属于"空宫"格局，通常需要借对宫星曜来分析，建议做详细解读。';
        }
        html += '</p>';
        html += '</div>';

        // 2. 各宫位速览
        html += '<div class="interp-card">';
        html += '<h3>📋 十二宫速览</h3>';
        html += '<p style="white-space:pre-line;">';
        var keyPalaces = ['命宫', '夫妻宫', '财帛宫', '官禄宫', '子女宫', '迁移宫'];
        for (var i = 0; i < astrolabe.palaces.length; i++) {
            var p = astrolabe.palaces[i];
            if (keyPalaces.indexOf(p.name) === -1) continue;
            var stars = [];
            if (p.majorStars) {
                for (var s = 0; s < p.majorStars.length; s++) {
                    if (p.majorStars[s] && p.majorStars[s].name) stars.push(p.majorStars[s].name);
                }
            }
            html += '【' + p.name + '】' + (stars.length > 0 ? stars.join('、') : '无主星');
            if (starInfo[stars[0]]) html += ' — ' + starInfo[stars[0]].desc;
            html += '\n';
        }
        html += '</p>';
        html += '</div>';

        // CTA
        html += '<div class="result-cta">';
        html += '<h3>想了解完整命盘解读？</h3>';
        html += '<p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">包含大运流年、事业财运详细分析、感情婚配建议</p>';
        html += '<div class="result-cta-btns">';
        html += '<button class="btn-cta-pay" onclick="openPayModal(\'ai_deep\')">获取详细分析 ¥99</button>';
        html += '<button class="btn-cta-wechat" onclick="document.getElementById(\'lead-popup\').classList.add(\'active\')">添加微信咨询</button>';
        html += '</div>';
        html += '</div>';

        // Restart
        html += '
            <div style="margin-top:24px;padding:20px;background:rgba(166,138,62,0.04);border-radius:12px;">
                <h3 style="font-size:0.95rem;color:var(--ink);margin-bottom:12px;">你可能还想测</h3>
                <div id="related-tests" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
            </div>
        
<div class="restart-wrap">';
        html += '<button class="btn-restart" onclick="restartTest()">重新排盘</button>';
        html += '</div>';

        screen.innerHTML = html;
        screen.style.display = 'block';
        screen.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Save to Supabase (if available)
        try {
            var resultData = {
                test_type: 'ziwei',
                birth_date: dateStr,
                birth_hour: hourIdx,
                gender: gender,
                major_stars: majorStars.join(','),
                result_text: '命宫：' + majorStars.join('、'),
                created_at: new Date().toISOString()
            };
            if (window.supabaseClient) {
                window.supabaseClient.from('test_results').insert([resultData]).then();
            }
        } catch(e) {}
    }

    window.restartTest = function() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('result-screen').innerHTML = '';
        document.getElementById('start-screen').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Payment modal fallback
    if (typeof window.openPayModal === 'undefined') {
        window.openPayModal = function(pid) {
            var modal = document.getElementById('modal-pay');
            if (modal) modal.classList.add('active');
            else alert('请添加微信咨询：在公众号"一宅一句"回复"咨询"获取联系方式');
        };
    }
    </script>
