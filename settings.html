<div class="grid2"><div><label>自动清理聊天记录</label><div style="margin-top:8px"><button id="toggle">切换周期</button> <span id="days" class="muted"></span></div></div>

</section></main>
<script>
(function(){
  var key='yzj_auto_clear_days';
  function txt(v){ return v==0?'永久':v+'天'; }
  var v=parseInt(localStorage.getItem(key)||'0',10);
  var days=document.getElementById('days');
  function render(){ days.textContent=txt(v); }
  render();
  document.getElementById('toggle').onclick=function(){ v=(v===7?30:(v===30?0:7)); localStorage.setItem(key,String(v)); render(); };
  document.getElementById('clearChat').onclick=function(){ localStorage.removeItem('yzj_chat_messages'); alert('聊天缓存已清理'); };
})();
</script>
