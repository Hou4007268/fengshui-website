    <div class="msg-page">
        <div class="msg-form">
            <h3>发表留言</h3>
            <div class="form-group">
                <label>昵称 *</label>
                <input type="text" id="msg-name" placeholder="你的昵称" maxlength="20">
            </div>
            <div class="form-group">

            </div>
            <div class="form-group">

            </div>

    <script src="../js/shared.js?v=20260417"></script>
    <script>
    var msgOffset = 0;
    var msgLimit = 20;

    function loadMessages(reset) {
        if (reset) msgOffset = 0;
        fetch('/api/messages?offset=' + msgOffset + '&limit=' + msgLimit)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var list = document.getElementById('msg-list');
                if (reset) list.innerHTML = '';
                var msgs = data.messages || [];
                if (msgs.length === 0 && msgOffset === 0) {
                    list.innerHTML = '<div class="msg-empty">暂无留言，快来抢沙发~</div>';
                    return;
                }
                for (var i = 0; i < msgs.length; i++) {
                    var m = msgs[i];
                    var card = document.createElement('div');
                    card.className = 'msg-card';
                    var html = '<div class="msg-header"><span class="msg-name">' + esc(m.name || '匿名') + '</span><span class="msg-time">' + fmtTime(m.created_at) + '</span></div>';
                    html += '<div class="msg-content">' + esc(m.content || '') + '</div>';
                    if (m.reply) {
                        html += '<div class="msg-reply"><div class="msg-reply-label">✏️ 博主回复</div><div class="msg-reply-text">' + esc(m.reply) + '</div></div>';
                    }
                    card.innerHTML = html;
                    list.appendChild(card);
                }
                msgOffset += msgs.length;
                document.getElementById('msg-count').textContent = '共 ' + (data.total || msgOffset) + ' 条';
                document.getElementById('load-more').style.display = msgs.length >= msgLimit ? 'block' : 'none';
            })
            .catch(function() {
                if (reset) document.getElementById('msg-list').innerHTML = '<div class="msg-empty">加载失败，请刷新重试</div>';
            });
    }

    function loadMore() { loadMessages(false); }

    function submitMsg() {
        var name = document.getElementById('msg-name').value.trim();
        var content = document.getElementById('msg-content').value.trim();
        var contact = document.getElementById('msg-contact').value.trim();
        if (!name || !content) { alert('请填写昵称和留言内容'); return; }
        fetch('/api/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, content: content, contact: contact})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                document.getElementById('msg-name').value = '';
                document.getElementById('msg-content').value = '';
                document.getElementById('msg-contact').value = '';
                loadMessages(true);
                alert('留言成功！');
            } else {
                alert('提交失败：' + (data.error || '请重试'));
            }
        })
        .catch(function() { alert('网络错误，请重试'); });
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtTime(t) {
        if (!t) return '';
        var d = new Date(t);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    loadMessages(true);
    </script>
