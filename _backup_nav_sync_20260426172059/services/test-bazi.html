<main class="container"><section class="simple-card"><h1>八字排盘测试</h1><p class="muted">输入生日与时辰，获取简版四柱分析。</p><div class="grid2"><div><label>出生日期</label><input id="d" type="date"></div><div><label>出生时辰</label><select id="h"><option>子时(23-01)</option><option>丑时(01-03)</option><option>寅时(03-05)</option><option>卯时(05-07)</option><option>辰时(07-09)</option><option>巳时(09-11)</option><option>午时(11-13)</option><option>未时(13-15)</option><option>申时(15-17)</option><option>酉时(17-19)</option><option>戌时(19-21)</option><option>亥时(21-23)</option></select></div></div><div style="margin-top:12px"><button id="go">开始排盘</button></div><div id="result" class="result"></div><p class="muted" style="margin-top:10px">本文仅供参考，风水文化传统讲究信则有不信则无。</p></section></main><script>(function(){var r=document.getElementById('result');document.getElementById('go').onclick=function(){var d=document.getElementById('d').value;if(!d){alert('请选择出生日期');return;}var h=document.getElementById('h').value;var stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];var branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];var seed=(new Date(d).getTime()/86400000|0)%10;var day=(new Date(d).getTime()/86400000|0)%12;var txt='你的四柱简析（简版）

年柱：'+stems[seed]+branches[day]+'
月柱：'+stems[(seed+2)%10]+branches[(day+2)%12]+'
日柱：'+stems[(seed+4)%10]+branches[(day+4)%12]+'
时柱：'+h.slice(0,2)+'

师傅建议：先看五行喜忌，再结合流年，不要只看单一神煞。';r.style.display='block';r.textContent=txt;};})();</script>
