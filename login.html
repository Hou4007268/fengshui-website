    .simple-card{max-width:840px;margin:24px auto;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:22px}

    input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;margin-top:6px}

<body>
<nav class="topbar"><div class="container"><div class="topbar-wrap"><a class="topbar-logo" href="index.html">🏯 一宅一句</a><div class="topbar-nav">

            </div></div></div></nav>

<main class="container">
  <section class="simple-card" style="max-width:560px">
    <h1 id="title">账号登录</h1>
    <p class="muted" id="subtitle">使用手机号+密码登录，一宅一句账号体系与App同步。</p>
    <div class="grid2"><div><label>手机号</label><input id="phone" maxlength="11" placeholder="请输入11位手机号"></div><div id="emailWrap" style="display:none"><label>邮箱</label><input id="email" placeholder="用于接收验证码"></div></div>
    <div id="codeWrap" style="display:none"><label>验证码</label><div style="display:flex;gap:8px"><input id="code" placeholder="输入邮箱验证码"><button type="button" id="sendCode" style="white-space:nowrap">发送验证码</button></div></div>
    <div><label id="pwdLabel">密码</label><input id="password" type="password" placeholder="请输入密码"></div>
    <div class="muted" id="pwdHint" style="display:none">密码要求：至少8位，包含字母+数字+特殊符号</div>
    <div style="display:flex;gap:10px;margin-top:14px"><button id="submitBtn">登录</button><a id="switchBtn" href="javascript:void(0)">没有账号？去注册</a><a id="resetBtn" href="javascript:void(0)">忘记密码</a></div>
    <div id="msg" class="result"></div>
  </section>
</main>
<script>
(function(){
  var mode = (new URLSearchParams(location.search).get('mode') || 'login');
  var title = document.getElementById('title'), subtitle = document.getElementById('subtitle');
  var emailWrap = document.getElementById('emailWrap'), codeWrap = document.getElementById('codeWrap');
  var switchBtn = document.getElementById('switchBtn'), resetBtn = document.getElementById('resetBtn');
  var submitBtn = document.getElementById('submitBtn'), sendCode = document.getElementById('sendCode');
  var pwdLabel = document.getElementById('pwdLabel'), pwdHint = document.getElementById('pwdHint');
  var msg = document.getElementById('msg');
  function showMsg(text, ok){ msg.style.display='block'; msg.style.color = ok ? '#2f7d32' : '#b3261e'; msg.textContent = text; }
  function ui(){
    var reg = mode==='register', reset = mode==='reset';
    title.textContent = reg ? '注册账号' : (reset ? '找回密码' : '账号登录');
    subtitle.textContent = reg ? '注册后自动登录并同步会员信息。' : (reset ? '输入手机号、邮箱验证码和新密码。' : '使用手机号+密码登录，一宅一句账号体系与App同步。');
    emailWrap.style.display = (reg||reset)?'block':'none';
    codeWrap.style.display = (reg||reset)?'block':'none';
    pwdLabel.textContent = reset ? '新密码' : '密码';
    pwdHint.style.display = (reg||reset)?'block':'none';
    submitBtn.textContent = reg?'注册':(reset?'重置密码':'登录');
    switchBtn.textContent = reg?'已有账号？去登录':'没有账号？去注册';
    resetBtn.style.display = mode==='login'?'inline':'none';
  }
  function validPwd(p){ return p.length>=8 && /[A-Za-z]/.test(p) && /\d/.test(p) && /[^A-Za-z\d]/.test(p); }
  function api(path,data){ return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()}); }
  function saveAuth(r){ localStorage.setItem('yzj_token', r.token||''); localStorage.setItem('yzj_user_id', r.user_id||''); localStorage.setItem('yzj_phone', r.phone||''); localStorage.setItem('yzj_member_type', r.member_type||'普通用户'); localStorage.setItem('yzj_member_expires', r.member_expires||''); }
  function phone(){ return document.getElementById('phone').value.trim(); }
  function email(){ return document.getElementById('email').value.trim(); }
  function code(){ return document.getElementById('code').value.trim(); }
  function pwd(){ return document.getElementById('password').value.trim(); }

  sendCode.onclick = function(){
    var p=phone(), e=email();
    if(!/^\d{11}$/.test(p)) return showMsg('请输入正确手机号',false);
    if(!e || e.indexOf('@')<0) return showMsg('请输入邮箱地址',false);
    sendCode.disabled=true;
    api('/api/auth/send-code',{phone:p,email:e,purpose:mode==='register'?'register':'reset'}).then(function(r){
      if(r.success){ showMsg(r.message||'验证码已发送',true); var s=60; sendCode.textContent=s+'秒'; var t=setInterval(function(){s--; sendCode.textContent=s+'秒'; if(s<=0){clearInterval(t); sendCode.disabled=false; sendCode.textContent='发送验证码';}},1000);} else { sendCode.disabled=false; showMsg(r.error||'发送失败',false);} 
    }).catch(function(err){ sendCode.disabled=false; showMsg('网络错误：'+err.message,false);});
  };

  submitBtn.onclick = function(){
    var p=phone(), pass=pwd();
    if(!/^\d{11}$/.test(p)) return showMsg('请输入正确手机号',false);
    if(!pass) return showMsg('请输入密码',false);
    if((mode==='register'||mode==='reset') && !validPwd(pass)) return showMsg('密码至少8位且包含字母+数字+特殊符号',false);
    submitBtn.disabled=true;
    if(mode==='login'){
      api('/api/auth/login',{phone:p,password:pass}).then(function(r){
        submitBtn.disabled=false;
        if(r.success){ saveAuth(r); showMsg('登录成功，正在进入个人中心...',true); setTimeout(function(){ location.href='/profile.html';},500);} else showMsg(r.error||'登录失败',false);
      }).catch(function(err){submitBtn.disabled=false;showMsg('网络错误：'+err.message,false);});
    } else if(mode==='register'){
      var c=code(), e=email(); if(!c) return showMsg('请输入验证码',false);
      api('/api/auth/register',{phone:p,code:c,password:pass,device_id:'web-'+(navigator.userAgent||'').slice(0,32)}).then(function(r){
        submitBtn.disabled=false;
        if(r.success){ saveAuth(r); if(e) localStorage.setItem('yzj_email',e); showMsg('注册成功，正在进入个人中心...',true); setTimeout(function(){ location.href='/profile.html';},500);} else showMsg(r.error||'注册失败',false);
      }).catch(function(err){submitBtn.disabled=false;showMsg('网络错误：'+err.message,false);});
    } else {
      var c=code(), e=email(); if(!c) return showMsg('请输入验证码',false);
      api('/api/auth/reset-password',{phone:p,code:c,password:pass}).then(function(r){
        submitBtn.disabled=false;
        if(r.success){ saveAuth(r); if(e) localStorage.setItem('yzj_email',e); showMsg('密码重置成功，正在进入个人中心...',true); setTimeout(function(){ location.href='/profile.html';},500);} else showMsg(r.error||'重置失败',false);
      }).catch(function(err){submitBtn.disabled=false;showMsg('网络错误：'+err.message,false);});
    }
  };

  switchBtn.onclick = function(){ mode = mode==='register'?'login':'register'; ui(); history.replaceState(null,'',mode==='login'?'/login.html':'/login.html?mode=register'); };
  resetBtn.onclick = function(){ mode='reset'; ui(); history.replaceState(null,'','/login.html?mode=reset'); };
  ui();
})();
</script>

<script src="js/shared.js?v=20260422-sync"></script>
</body>
</html>
