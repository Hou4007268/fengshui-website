<main class="container"><section class="simple-card" style="max-width:560px">
<h1>兑换码</h1><p class="muted">输入兑换码激活权益。与App兑换接口同步。</p>
<label>兑换码</label><input id="code" placeholder="例如 VIP2026XXXX" style="text-transform:uppercase"/>
<div style="margin-top:12px"><button id="go">立即兑换</button></div>
<div class="result" id="msg"></div>
</section></main>
<script>
(function(){
  var msg=document.getElementById('msg');
  function show(t,ok){ msg.style.display='block'; msg.style.color=ok?'#2f7d32':'#b3261e'; msg.textContent=t; }
  document.getElementById('go').onclick=function(){
    var code=(document.getElementById('code').value||'').trim().toUpperCase();
    if(!code) return show('请输入兑换码',false);
    fetch('/api/redeem/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      code:code,
      client_key:'web-'+(navigator.userAgent||'').slice(0,24),
      source_page:'web_redeem',
      user_id: localStorage.getItem('yzj_user_id') || ''
    })}).then(function(r){return r.json()}).then(function(d){
      if(d.success){ show('✓ '+(d.message||'兑换成功'),true); }
      else show('✗ '+(d.error||'兑换失败'),false);
    }).catch(function(e){ show('网络错误：'+e.message,false); });
  }
})();
</script>

<script src="js/shared.js?v=20260422-sync"></script>
